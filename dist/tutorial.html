<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一關 · 森林入門</title><link rel="stylesheet" href="tutorial.css"></head>
<body>
  <header class="game-header"><div><a href="index.html#levels">← 選關地圖</a><h1>林間入口 <small>第一關 · 教學</small></h1></div><div class="hud"><span>金幣 <b id="coins">120</b></span><span>生命 <b id="hearts">♥ ♥ ♥</b></span><span>波次 <b id="wave">0 / 4</b></span><button id="speed" aria-label="切換遊戲速度">1×</button><button id="pause" aria-pressed="false">暫停</button></div></header>
  <main class="game-layout">
    <section class="battlefield" aria-label="第一關戰場"><div class="map-heading"><span>翡翠森林 · 守住林間小徑</span><span>出口 ← 怪物由右側進入</span></div><div class="map-space"><div class="map-frame" id="map-frame"><canvas id="battlefield" width="1280" height="768" aria-label="森林直線道路與四個建造臺座"></canvas><div id="pads" aria-label="建造臺座"></div><div id="pause-shade" hidden>已暫停</div></div></div><p class="map-help">選擇有「＋」的臺座建塔。點選箭塔可升級、修復或拆除。</p></section>
    <aside class="guide-panel"><div class="guide-top"><span class="guide-badge">森林守衛手冊</span><span id="step-label">01 / 04</span></div><div class="wave-track" aria-label="四波教學進度"><span>1 建塔</span><span>2 升級</span><span>3 迎敵</span><span>4 守住</span></div><section class="lesson" aria-live="polite"><p id="lesson-tag">歡迎，新任守衛</p><h2 id="lesson-title">建立第一座箭塔</h2><p id="lesson-copy">正在準備森林素材…</p><p class="lesson-goal" id="lesson-goal"></p></section><button id="next-wave" class="gold-button" disabled>先建造一座箭塔</button><p id="wave-status" role="status"></p><section class="tower-panel"><p class="section-label">建築管理</p><h3 id="tower-title">選擇臺座</h3><p id="tower-info">點選戰場上的「＋」開始。</p><button id="build" class="gold-button" disabled>建造箭塔 · 60</button><div class="secondary-actions"><button id="repair" hidden>修復 · 50</button><button id="demolish" hidden>拆除</button></div><p id="feedback" role="status"></p></section><p class="guide-footnote">準備階段不會自動出怪，可安心閱讀教學。</p></aside>
  </main>
  <dialog id="result" aria-labelledby="result-title"><div class="result-content"><p class="guide-badge">森林守衛 · 第一關</p><h2 id="result-title"></h2><p id="result-copy"></p><p id="save-note"></p><button id="restart" class="gold-button">再玩一次</button><a href="index.html#levels">返回選關地圖 →</a></div></dialog>
  <script src="enemy-sprites.js"></script><script src="tower-sprites.js"></script><script src="tower-work.js"></script><script src="environment.js"></script><script src="engine.js"></script><script src="tutorial-level.js"></script><script src="tutorial.js"></script>
</body></html>
