<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#204a32"><meta name="description" content="林境守衛：築塔守護，守住家園。森林像素塔防遊戲。">
  <link rel="preload" href="assets/ui/home-forest.png" as="image" fetchpriority="high">
  <link rel="preload" href="assets/fonts/fusion-pixel-12px-proportional-zh_hant.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="cursor.css">
<title>林境守衛</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%233b6b60'/%3E%3Cpath d='M16 9v14' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="start-screen.css">
  <link rel="stylesheet" href="level-select.css">
  <link rel="stylesheet" href="settings-panel.css">
</head>
<body>
  <section id="start-screen" aria-labelledby="menu-title">
    <div class="home-artboard" id="home-artboard">
      <img class="home-art" id="home-art" src="assets/ui/home-forest.png" width="1739" height="904" alt="" fetchpriority="high" draggable="false">
      <canvas id="forest-scene" aria-hidden="true"></canvas>
      <h1 id="menu-title" class="home-sr-only">林境守衛</h1>
      <p class="home-sr-only">築塔守護・守住家園</p>
      <nav class="home-menu" aria-label="主選單">
        <button id="start" class="home-button" disabled><span id="start-label" class="home-sr-only">開始遊戲</span></button>
        <button id="settings-open" class="home-button" aria-haspopup="dialog" aria-controls="settings-dialog" aria-expanded="false"><span class="home-sr-only">設定</span></button>
      </nav>
    </div>
    <p id="menu-status" class="menu-status" role="status">正在準備森林素材…</p>
  </section>
  <section id="level-screen" aria-labelledby="world-title" hidden>
    <h1 id="world-title" class="map-sr-only">翡翠森林選關地圖</h1>
    <button id="world-settings-open" aria-label="選關設定" title="設定" aria-haspopup="dialog" aria-controls="world-settings" aria-expanded="false"><span class="world-settings-icon" aria-hidden="true"></span></button>
    <div class="world-map" id="world-map">
      <div class="map-surface">
      <nav id="world-levels" aria-label="森林關卡地圖">
        <button class="level-node" data-stage="1" style="left:12.6%;top:68%" aria-haspopup="dialog" aria-controls="stage-dialog" aria-expanded="false">
          <span class="node-art" aria-hidden="true"><img class="node-pad" src="assets/ui/level-markers/pedestal.png" alt=""><img class="node-flag" src="assets/ui/level-markers/banner-1.png" alt=""><img class="node-lock" src="assets/ui/level-markers/lock-chains.png" alt="" hidden></span>
          <span class="node-stars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <button class="level-node" data-stage="2" style="left:19.1%;top:36%" aria-haspopup="dialog" aria-controls="stage-dialog" aria-expanded="false">
          <span class="node-art" aria-hidden="true"><img class="node-pad" src="assets/ui/level-markers/pedestal.png" alt=""><img class="node-flag" src="assets/ui/level-markers/banner-2.png" alt=""><img class="node-lock" src="assets/ui/level-markers/lock-chains.png" alt="" hidden></span>
          <span class="node-stars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <button class="level-node" data-stage="3" style="left:47.8%;top:52.4%" aria-haspopup="dialog" aria-controls="stage-dialog" aria-expanded="false">
          <span class="node-art" aria-hidden="true"><img class="node-pad" src="assets/ui/level-markers/pedestal.png" alt=""><img class="node-flag" src="assets/ui/level-markers/banner-3.png" alt=""><img class="node-lock" src="assets/ui/level-markers/lock-chains.png" alt="" hidden></span>
          <span class="node-stars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <button class="level-node" data-stage="4" style="left:67.8%;top:59.5%" aria-haspopup="dialog" aria-controls="stage-dialog" aria-expanded="false">
          <span class="node-art" aria-hidden="true"><img class="node-pad" src="assets/ui/level-markers/pedestal.png" alt=""><img class="node-flag" src="assets/ui/level-markers/banner-4.png" alt=""><img class="node-lock" src="assets/ui/level-markers/lock-chains.png" alt="" hidden></span>
          <span class="node-stars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <button class="level-node boss-node" data-stage="5" style="left:90.5%;top:43%" aria-haspopup="dialog" aria-controls="stage-dialog" aria-expanded="false">
          <span class="node-art" aria-hidden="true"><img class="node-pad" src="assets/ui/level-markers/pedestal.png" alt=""><img class="node-flag" src="assets/ui/level-markers/banner-5.png" alt=""><img class="node-lock" src="assets/ui/level-markers/lock-chains.png" alt="" hidden></span>
          <span class="node-stars" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </nav>
      </div>
    </div>

  </section>
  <dialog id="world-settings" data-settings-panel="map" aria-labelledby="world-settings-title"></dialog>
  <dialog id="stage-dialog" aria-labelledby="stage-title" aria-describedby="stage-name">
    <div class="stage-panel">
      <header class="stage-heading"><h2 id="stage-title">第 1 關</h2><p id="stage-name">林間入口</p></header>
      <button id="stage-close" aria-label="關閉關卡資訊" autofocus>×</button>
      <div class="stage-body">
        <figure class="stage-landscape"><div id="stage-preview" role="img"></div></figure>
        <section class="enemy-info" aria-labelledby="enemy-heading"><h3 id="enemy-heading">敵人資訊</h3><ul id="stage-enemies"></ul><p id="enemies-pending" hidden>敵人配置準備中</p></section>
      </div>
      <div class="stage-record"><span class="record-label">最佳紀錄</span><span id="stage-stars" class="record-stars" role="img" aria-label="尚未取得星星"><span></span><span></span><span></span></span><span id="stage-clear-status"></span></div>
      <button id="stage-enter"><img src="assets/ui/ready-swords.png" alt=""><span id="stage-enter-label">開始挑戰</span></button>
    </div>
  </dialog>
  <dialog id="settings-dialog" data-settings-panel="home" aria-labelledby="settings-title"></dialog>
  <script src="sound-manager.js"></script><script src="settings-panel.js"></script><script src="sound-settings.js"></script><script src="environment.js"></script><script src="start-screen.js"></script><script src="enemy-sprites.js"></script><script src="level-progress.js"></script><script src="level-select.js"></script><script src="menu.js"></script>
</body>
</html>
