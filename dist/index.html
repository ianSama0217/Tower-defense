<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeae0"><meta name="description" content="森林像素塔防素材與行為測試，提供五關選關畫面預覽。">
  <title>幾何防線 · 森林守衛</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%233b6b60'/%3E%3Cpath d='M16 9v14' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="start-screen.css">
  <link rel="stylesheet" href="level-select.css">
</head>
<body>
  <section id="start-screen" aria-labelledby="menu-title">
    <canvas id="forest-scene" aria-hidden="true"></canvas>
    <div class="forest-light" aria-hidden="true"></div>
    <div class="menu-brand"><span class="brand-emblem" aria-hidden="true"></span>幾何防線<span class="brand-divider">/</span><span>森林守衛</span></div>
    <div class="menu-content">
      <p class="menu-eyebrow"><span aria-hidden="true">✦</span> 林間的冒險，即將開始 <span aria-hidden="true">✦</span></p>
      <h1 id="menu-title">幾何防線</h1>
      <p class="menu-subtitle">築起箭塔，守護這片森林。</p>
      <nav class="wood-sign" aria-label="主選單">
        <span class="sign-rope rope-left" aria-hidden="true"></span><span class="sign-rope rope-right" aria-hidden="true"></span>
        <span class="sign-post" aria-hidden="true"></span>
        <button id="start" class="wood-button" disabled><span class="menu-pointer" aria-hidden="true"></span><span id="start-label">開始遊戲</span><span class="menu-spark" aria-hidden="true">✦</span></button>
        <button id="settings-open" class="wood-button wood-secondary" aria-haspopup="dialog"><span class="menu-pointer" aria-hidden="true"></span><span>設定</span><span class="menu-spark" aria-hidden="true">✦</span></button>
        <img class="sign-fern" src="assets/environment/fern.png" alt=""><img class="sign-flowers" src="assets/environment/whiteFlowers.png" alt="">
      </nav>
      <p id="menu-status" class="menu-status" role="status">正在準備森林素材…</p>
    </div>
    <div class="menu-footer"><span class="footer-leaf" aria-hidden="true">◆</span> 每一座箭塔，都是森林的防線 <span class="footer-leaf" aria-hidden="true">◆</span></div>
  </section>
  <section id="level-screen" aria-labelledby="world-title" hidden>
    <div class="world-topbar"><button id="world-back" class="world-back"><span aria-hidden="true">←</span> 返回首頁</button><span class="world-brand">幾何防線 <span>/</span> 森林守衛</span><span class="world-chapter">WORLD 01</span></div>
    <div class="world-heading"><p>第一章 · FOREST TRAIL</p><h1 id="world-title">翡翠森林</h1><span>沿著林間小徑，走向森林深處。</span></div>
    <div class="world-map" id="world-map">
      <canvas id="world-scenery" aria-hidden="true"></canvas>
      <nav id="world-levels" aria-label="森林關卡地圖">
        <button class="level-node" data-stage="1" aria-label="第 1 關，林間入口" aria-pressed="true"><span class="node-art"><img class="node-pad" src="assets/environment/buildPad.png" alt=""><img class="node-tower" src="assets/towers/tower_lv1.png" alt=""></span><span class="node-number">1</span><span class="node-name">林間入口</span><span class="node-marker" aria-hidden="true">▼</span></button>
        <button class="level-node" data-stage="2" aria-label="第 2 關，花徑哨站" aria-pressed="false"><span class="node-art"><img class="node-pad" src="assets/environment/buildPad.png" alt=""><img class="node-tower" src="assets/towers/tower_lv1.png" alt=""></span><span class="node-number">2</span><span class="node-name">花徑哨站</span><span class="node-marker" aria-hidden="true">▼</span></button>
        <button class="level-node" data-stage="3" aria-label="第 3 關，古木岔路" aria-pressed="false"><span class="node-art"><img class="node-pad" src="assets/environment/buildPad.png" alt=""><img class="node-tower" src="assets/towers/tower_lv1.png" alt=""></span><span class="node-number">3</span><span class="node-name">古木岔路</span><span class="node-marker" aria-hidden="true">▼</span></button>
        <button class="level-node" data-stage="4" aria-label="第 4 關，暮色防線" aria-pressed="false"><span class="node-art"><img class="node-pad" src="assets/environment/buildPad.png" alt=""><img class="node-tower" src="assets/towers/tower_lv2.png" alt=""></span><span class="node-number">4</span><span class="node-name">暮色防線</span><span class="node-marker" aria-hidden="true">▼</span></button>
        <button class="level-node boss-node" data-stage="5" aria-label="第 5 關，BOSS，荊棘王座" aria-pressed="false"><span class="boss-banner">BOSS</span><span class="node-art"><img class="boss-fort" src="assets/ui/boss-fort.svg" alt=""></span><span class="node-number">5</span><span class="node-name">荊棘王座</span><span class="node-marker" aria-hidden="true">▼</span></button>
      </nav>
      <div class="map-compass" aria-hidden="true"><span>N</span><b>✦</b><small>翡翠林地</small></div>
    </div>
    <div class="world-bottom"><div class="stage-details" aria-live="polite" aria-atomic="true"><span id="stage-index">01</span><div><p id="stage-kind">森林旅程 · 第 1 關</p><h2 id="stage-title">林間入口</h2><p id="stage-description">陽光灑落的小徑，森林旅程的起點。</p></div><a id="stage-enter" href="tutorial.html">開始教學 →</a><span id="stage-availability" hidden>關卡準備中</span></div><p class="world-help">點選關卡查看路標 <span>·</span> 五段旅程，一片需要守護的森林</p></div>
  </section>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog" class="settings-panel">
      <p class="settings-eyebrow">FOREST DEFENSE</p>
      <h2 id="settings-title">遊戲設定</h2>
      <div class="setting-row"><label for="default-speed">初始遊戲速度<small>進入關卡後仍可隨時切換</small></label><select id="default-speed"><option value="1">正常 · 1×</option><option value="2">快速 · 2×</option></select></div>
      <div class="setting-row"><label for="ambient-motion">森林動態<small>首頁的螢火與浮動光點</small></label><input id="ambient-motion" type="checkbox" role="switch" checked></div>
      <p id="settings-note">設定會自動保存在此瀏覽器。</p>
      <button class="wood-button settings-done" autofocus>返回木牌</button>
    </form>
  </dialog>
  <script src="environment.js"></script><script src="start-screen.js"></script><script src="level-select.js"></script><script src="menu.js"></script>
</body>
</html>
