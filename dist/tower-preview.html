<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>箭塔素材 · Lv1–3</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#1b222b;color:#ecebe5;font:15px system-ui}h1{margin:0 0 8px;font-size:26px}p{color:#b4c0cb}button{font:inherit;background:#344352;color:#fff;border:1px solid #677989;border-radius:6px;padding:8px 16px;margin:10px 8px 12px 0}.cards{display:flex;gap:20px;flex-wrap:wrap}article{padding:20px;border-radius:12px;background:#28333f;flex:1;min-width:280px}h2{font-size:20px}.stage{height:390px;display:flex;align-items:flex-end;justify-content:center;background:conic-gradient(#d6dbe1 25%,#aab2bd 0 50%,#d6dbe1 0 75%,#aab2bd 0) 0 0/16px 16px;border-radius:8px;overflow:hidden}.stage img{image-rendering:pixelated;max-width:100%;object-fit:contain}.light .stage{background:#e5e7d9}.dark .stage{background:#080d13}a{color:#b9ddcd}.native img{width:auto;height:auto}.native .stage{height:150px}</style>
<h1>箭塔素材 · Lv1／Lv2／Lv3</h1><p>3/4 輕俯視 · RGBA 真透明 · 各等級共用 2×2 Tile 建造占地</p><button id="bg">切換背景</button><button id="size">顯示原始尺寸</button><div class="cards" id="cards"></div>
<script src="tower-sprites.js"></script><script>
const names=['','木造瞭望塔','石造箭塔','強化石造箭塔'],details=['','木柱、木平台、梯子 · 棕色旗幟','圓形石塔、城垛 · 藍色旗幟','加寬石塔、雙側塔柱、強化城垛 · 藍色旗幟'];
for(let level=1;level<=3;level++){const s=TowerSprites.specs[level],card=document.createElement('article');card.innerHTML=`<h2>Lv${level} · ${names[level]}</h2><p>${s.archers} 名弓箭手 · ${s.size}×${s.size}px</p><div class="stage"><img src="assets/towers/${s.file}" width="${s.size*4}" height="${s.size*4}" alt="${names[level]}，${s.archers} 名弓箭手"></div><p>${details[level]}</p><p>底部 anchor (${s.anchor.x}, ${s.anchor.y})</p><a download href="assets/towers/${s.file}">${s.file}</a>`;document.getElementById('cards').append(card);}
let bg=0;document.getElementById('bg').onclick=()=>{document.body.classList.remove('light','dark');const value=['','light','dark'][++bg%3];if(value)document.body.classList.add(value);};document.getElementById('size').onclick=e=>{document.body.classList.toggle('native');e.target.textContent=document.body.classList.contains('native')?'放大 4 倍':'顯示原始尺寸';};
</script></html>
