<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preload" href="assets/fonts/fusion-pixel-12px-proportional-zh_hant.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<title>敵方單位精靈圖驗收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171c24;color:#e7e7e2;font:15px var(--font-ui);padding:32px}h1{font-size:25px;margin:0 0 8px}p{color:#aebbc9}button,select{font:inherit;padding:8px 14px;background:#303b49;color:inherit;border:1px solid #637084;border-radius:6px;margin-right:8px}.enemy{margin-top:30px;padding:20px;background:#242c37;border-radius:12px}.states{display:flex;gap:18px;flex-wrap:wrap}.state{min-width:145px;text-align:center}.stage{height:200px;display:flex;align-items:flex-end;justify-content:center;background:conic-gradient(#e4e5e9 25%,#b4bac3 0 50%,#e4e5e9 0 75%,#b4bac3 0) 0 0/16px 16px;border-radius:6px}canvas{image-rendering:pixelated;display:block}small{color:#aebbc9}.strip{overflow:auto;margin-top:18px;background:conic-gradient(#e4e5e9 25%,#b4bac3 0 50%,#e4e5e9 0 75%,#b4bac3 0) 0 0/16px 16px}.strip img{image-rendering:pixelated;display:block}.light .stage,.light .strip{background:#f6f0db}.dark .stage,.dark .strip{background:#080b10}a{color:#b7decf}
</style>
<h1>敵方單位 · 精靈圖驗收</h1>
<p>原有單位 20 格；炸彈哥布林與史萊姆各 24 格（待機／移動／受傷／死亡各 6 格，無攻擊）。單列、零間距、RGBA 真透明。紅線為固定腳底 anchor。</p>
<button id="play">暫停</button><button id="step">逐格</button><button id="flip">翻轉方向</button><select id="background"><option value="">透明棋盤</option><option value="light">淺色背景</option><option value="dark">深色背景</option></select>
<main id="units"></main><script src="enemy-sprites.js"></script><script>
const labels=['','Lv1 哥布林','Lv2 獸人','Lv3 獨眼巨人','炸彈哥布林','史萊姆'],cards=[];
let running=true,time=0,previous=0,facing=1,manualTick=null;
for(let level=1;level<EnemySprites.specs.length;level++){
  const spec=EnemySprites.specs[level],section=document.createElement('section');section.className='enemy';
  section.innerHTML=`<h2>${labels[level]} <small>${spec.size}×${spec.size} / frame · anchor (${spec.anchor.x}, ${spec.anchor.y})</small></h2><div class="states"></div><div class="strip"><img src="assets/enemies/${spec.file}" width="${spec.size*(spec.frames||20)*2}" height="${spec.size*2}" alt="${labels[level]} 完整精靈圖"></div><p><a href="assets/enemies/${spec.file}" download>${spec.file}</a> · ${spec.size*(spec.frames||20)}×${spec.size}px</p>`;
  document.getElementById('units').append(section);
  const img=new Image();img.src=`assets/enemies/${spec.file}`;
  for(const [state,a] of Object.entries(spec.animations||EnemySprites.animations)){
    const card=document.createElement('div');card.className='state';card.innerHTML=`<p>${state} (${a.count})</p><div class="stage"><canvas width="192" height="192"></canvas></div><p class="index"></p>`;
    section.querySelector('.states').append(card);cards.push({canvas:card.querySelector('canvas'),index:card.querySelector('.index'),a,img,spec,state});
  }
}
function draw(now){
  if(running)time+=Math.min(.05,(now-previous)/1000);previous=now;
  for(const {canvas,index,a,img,spec,state} of cards){
    const ctx=canvas.getContext('2d'),cycle=a.count/a.fps+(a.loop?0:.55),tick=manualTick===null?Math.min(a.count-1,Math.floor((time%cycle)*a.fps)):manualTick%a.count,frame=a.start+tick;
    ctx.clearRect(0,0,192,192);ctx.imageSmoothingEnabled=false;
    const scale=4,ground=180;ctx.save();ctx.translate(96,ground);ctx.scale(facing*scale,scale);
    if(img.complete&&img.naturalWidth)ctx.drawImage(img,frame*spec.size,0,spec.size,spec.size,-spec.anchor.x,-spec.anchor.y,spec.size,spec.size);ctx.restore();
    ctx.strokeStyle='#dd4454';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,ground+.5);ctx.lineTo(192,ground+.5);ctx.moveTo(96.5,176);ctx.lineTo(96.5,185);ctx.stroke();
    index.textContent=`frame ${frame} · source x=${frame*spec.size}`;
  }
  requestAnimationFrame(draw);
}
document.getElementById('play').onclick=()=>{running=!running;if(running)manualTick=null;document.getElementById('play').textContent=running?'暫停':'播放';};
document.getElementById('step').onclick=()=>{running=false;manualTick=manualTick===null?0:manualTick+1;document.getElementById('play').textContent='播放';};
document.getElementById('flip').onclick=()=>facing*=-1;
document.getElementById('background').onchange=e=>document.body.className=e.target.value;
requestAnimationFrame(draw);
</script></html>
